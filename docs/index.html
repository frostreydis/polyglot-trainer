*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}

header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px}
.brand{font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:8px}

.logo{display:inline-flex;flex:none;height:18px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.logo svg{display:block;height:100%;width:auto}
.logo.square{height:28px;border-radius:7px;box-shadow:none}
.lang-name{font-weight:500;font-size:.85rem;color:var(--muted)}
body.no-lang nav.tabs{display:none}
.vv{font-size:.8em;font-weight:400;color:var(--muted);white-space:nowrap}
.vv .say{color:var(--muted);font-weight:500}
.flag-ic{display:inline-flex;height:13px;vertical-align:-2px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.flag-ic svg{display:block;height:100%;width:auto}
.variant-pick .btn.big{font-size:1.05rem;padding:12px 18px}

.variant-card{border:2px solid var(--blue)}

.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}

table{border-collapse:collapse;width:100%;margin:8px 0 12px;font-size:.95rem}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}

.tblwrap{overflow-x:auto}
.note{background:var(--amber-soft);border-left:4px solid var(--amber);padding:10px 14px;border-radius:8px;margin:10px 0}
.tip{background:var(--blue-soft);border-left:4px solid var(--blue);padding:10px 14px;border-radius:8px;margin:10px 0}
.good{background:var(--green-soft);border-left:4px solid var(--green);padding:10px 14px;border-radius:8px;margin:10px 0}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}

.subtabs button.active{background:var(--blue);border-color:var(--blue);color:#fff}
ul.check{list-style:none;padding-left:0} ul.check li{padding:3px 0 3px 26px;position:relative}
ul.check li::before{content:"✓";position:absolute;left:4px;color:var(--green);font-weight:700}
.lesson-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:6px 0;background:var(--card);text-decoration:none;color:var(--text)}
.lesson-item .num{font-weight:700;color:var(--blue);min-width:40px}
.ex-box{max-width:640px;margin:0 auto}
.ex-q{font-size:1.15rem;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--text);padding:11px 14px;border-radius:12px;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
input[type=text],input[type=number],input[type=search],select,textarea{font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);width:100%}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--blue)}
input.ok{border-color:var(--green);background:var(--green-soft)} input.bad{border-color:var(--red);background:var(--red-soft)}
.dia{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.dia button{min-width:34px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.tokens{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px;border:1.5px dashed var(--line);border-radius:12px;margin:6px 0}
.tok{padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:var(--blue-soft);color:var(--text);cursor:pointer;font:inherit}
.feedback{margin-top:12px;padding:10px 14px;border-radius:10px}
.feedback.ok{background:var(--green-soft)} .feedback.bad{background:var(--red-soft)} .feedback.near{background:var(--amber-soft)}
.flash{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.flash .front{font-size:1.7rem;font-weight:700}
.flash .back{font-size:1.25rem}
.srs-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.srs-btns .btn{justify-content:center;flex-direction:column;gap:0}
.srs-btns small{font-weight:400;color:var(--muted);font-size:.75rem}
.big-phrase{font-size:1.5rem;font-weight:700;color:var(--blue);margin:6px 0}
.timer{font-variant-numeric:tabular-nums;font-size:1.4rem;font-weight:700}
details.stage{margin:0 0 12px}
details.stage>summary{cursor:pointer;list-style:none}
details.stage>summary::-webkit-details-marker{display:none}
details.mod{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;background:var(--card)}
details.mod>summary{cursor:pointer;font-weight:600}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;margin-top:8px}
.kv b{color:var(--muted);font-weight:600}
.done-mark{color:var(--green);font-weight:700}
.week-plan td:first-child{white-space:nowrap;font-weight:600}
.today-row{background:var(--blue-soft)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.95}
/* Підсвітка при наведенні лише там, де є миша: на сенсорному екрані вона «залипає» після дотику */
@media (hover:hover){
  .btn:hover,.lesson-item:hover,.opt:hover:not(:disabled),.ic:hover,.dia button:hover{border-color:var(--blue)}
  .btn.primary:hover{filter:brightness(1.08)}
  .say:hover{border-bottom-color:var(--blue)}
}
@media (pointer:coarse){.kbd{display:none}}
.lc-more{margin-top:8px}
.lc-more>summary{cursor:pointer;padding:4px 0}
.lc-more>.row{margin-top:4px!important}
.update-bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;background:var(--card);color:var(--text);border:1px solid var(--blue);border-radius:12px;padding:8px 10px 8px 14px;box-shadow:0 4px 16px rgba(16,24,40,.18);max-width:calc(100% - 24px)}
.warn-banner{background:var(--amber-soft);border:1px solid var(--amber);color:var(--text);padding:8px 12px;border-radius:10px;margin-bottom:12px;font-size:.92rem}
/* Вісім вкладок із повними підписами вміщаються не на кожному екрані, а ширина залежить від шрифту й емодзі системи.
   Тому views2.js → fitNav вимірює навігацію: тісно — компактні вкладки (як на телефоні), все одно тісно — без назви біля логотипа */
@media (min-width:701px){
  header.nav-compact nav.tabs a{display:flex;flex-direction:column;align-items:center;padding:4px 8px;font-size:.85rem;line-height:1.25}
  header.nav-compact nav.tabs a .lbl{display:none}
  header.nav-compact nav.tabs a .lbl-s{display:block;font-size:.72rem}
  header.nav-compact .lang-name,header.nav-tight .brand-name{display:none}
}
@media (max-width:700px){
  body{font-size:15.5px}
  .top-inner{padding:8px 12px}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;z-index:30}
  nav.tabs a{flex:1;min-width:0;padding:6px 2px;font-size:.78rem;display:flex;flex-direction:column;align-items:center}
  nav.tabs a .lbl{display:none}
  nav.tabs a .lbl-s{display:block;font-size:.68rem}
  .kv{grid-template-columns:1fr}
  .srs-btns{grid-template-columns:repeat(2,1fr)}
  .card{padding:14px}
  h1{font-size:1.3rem}
  main{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .update-bar{bottom:calc(76px + env(safe-area-inset-bottom))}
  /* Шапка уроку: мета видна лише на теорії, вкладки — одним рядком із прокруткою, щоб вправа була на першому екрані */
  .lesson-head:not(.tab-theory) .lesson-goals{display:none}
  .subtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:4px}
  .subtabs button{flex:none}
  /* «Програма» на телефоні відкривається з «Уроків»: восьма вкладка в нижній навігації не вміщується */
  nav.tabs a.wide-only{display:none}
  .dict-row{flex-wrap:wrap}
  .dict-actions{width:100%;justify-content:flex-start}
  .ic{min-width:44px;height:40px}
  /* Два ряди по 9 клавіш на всю ширину: вищі кнопки легше влучити пальцем, а займають менше місця, ніж три ряди */
  .dia{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
  .dia button{min-width:0;height:42px;padding:0}
}

.card.inner{box-shadow:none;margin-top:12px;background:var(--bg)}
.file-btn{position:relative}
code{background:var(--blue-soft);padding:1px 5px;border-radius:5px;font-size:.88em}

.theory h3{margin-top:1.1em}
.app-logo{display:inline-flex;flex:none;width:56px;height:56px;margin-right:6px}

@media print{

  body{background:#fff;color:#000} .card{box-shadow:none;border-color:#ccc}
  details{display:block} details>*{display:block}
  main{padding:0}
}

<script>
/* Polyglot — спільний рушій: стан додатка й мов, мовні пакети, озвучення, запис, перевірка відповідей, інтервальне повторення */
window.PG = window.PG || {};
(function (PG) {
  'use strict';

  // Мова-чернетка (draft: true у реєстрі) видна лише під час розробки в src/: build.mjs її не збирає

  // Файли пакета (pack.js, gen.js, data/*.js) викликають PG.pack('xx') у довільному порядку, тож об'єкт створює перший
  PG.pack = (code) => PG.packs[code] || (PG.packs[code] = { code, lessons: [] });
  PG.langInfo = (code) => (PG.LANGS || []).find((l) => l.code === code) || null;

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const UNSAFE = new Set(['__proto__', 'constructor', 'prototype']);
  function merge(base, extra) {
    for (const k of Object.keys(extra || {})) {
      if (UNSAFE.has(k)) continue;
      if (extra[k] && typeof extra[k] === 'object' && !Array.isArray(extra[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) merge(base[k], extra[k]);
      else base[k] = extra[k];
    }
    return base;
  }
  PG.clone = clone;
  PG.merge = merge;
  const readRaw = (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } };
  const parseObj = (raw) => { const d = JSON.parse(raw); if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('не об\'єкт'); return d; };

  // Ключі НЕ змінювати: інакше збережений вибір і прогрес не відкриються. Вони відрізняються від ключів старих
  // тренажерів (sk-trainer-v1, en-trainer-v1), бо сайти GitHub Pages одного акаунта мають спільне сховище.
  const APP_KEY = 'pg-app-v1';
  const APP_VERSION = 1;
  const APP_DEFAULTS = { v: APP_VERSION, lang: null, ui: { installTip: true } };
  function loadApp() {
    const raw = readRaw(APP_KEY);
    if (!raw) return clone(APP_DEFAULTS);
    try {
      const a = merge(clone(APP_DEFAULTS), parseObj(raw));
      if (!PG.langInfo(a.lang)) a.lang = null;
      a.ui.installTip = a.ui.installTip !== false;
      return a;
    } catch (e) { console.warn('Не вдалося прочитати вибір мови', e); return clone(APP_DEFAULTS); }
  }
  PG.saveApp = function () {
    try { localStorage.setItem(APP_KEY, JSON.stringify(PG.A)); } catch (e) { console.warn('Вибір мови не збережено', e); }
  };

  // Прогрес кожної мови — під власним ключем, а не в одному спільному записі: скидання, міграція чи пошкодження
  // прогресу однієї мови не зачіпають інших, а вкладки з різними мовами не затирають одна одну
  const LANG_PREFIX = 'pg-lang-v1:';
  const LANG_VERSION = 1;   // версія схеми стану мови: змінили формат → +1 і крок у MIGRATIONS
  // MIGRATIONS[n](s, pack) переводить стан версії n у версію n + 1 (змінює s на місці)
  const MIGRATIONS = {};
  PG.langKey = (code) => LANG_PREFIX + code;
  function defaults(pack) {
    return {
      v: LANG_VERSION,
      start: null,
      settings: Object.assign({ voice: '', rate: 0.9, strict: false, newPerDay: 10, dir: 'mix' }, clone((pack.settings && pack.settings.defaults) || {})),
      lessons: {},   // id -> {opened, theory, ex:{best,done}, speak, mission, skipped, run}
      modules: {},   // id модуля програми -> true (ручні позначки для етапів без уроків)
      cards: {},     // id картки -> {due,int,ease,reps,lapses}
      dict: [],      // мій словник [{word, uk, note, ex, ipa, au:{<варіант>:url}, added}]
      days: {},      // номер дня -> {ex, cards, speak}
      newDay: { day: 0, count: 0 },
      ui: Object.assign({ dictSort: 'new' }, clone(pack.uiDefaults || {}))

  const str = (v, max) => String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, max);
  // Записи носіїв — лише з відомих адрес: інакше файл імпорту міг би підсунути довільну адресу для <audio>
  const AUDIO_OK = /^https:\/\/(api\.dictionaryapi\.dev\/media\/|ssl\.gstatic\.com\/dictionary\/|upload\.wikimedia\.org\/)[^\s"'<>]+\.(mp3|ogg|wav)$/i;
  PG.cleanWord = function (w) {

    const out = { word: str(w.word, 200), uk: str(w.uk, 300) };
    if (!out.word || !out.uk) return null;
    const note = str(w.note, 300), ex = str(w.ex, 500), ipa = str(w.ipa, 100), added = str(w.added, 10);
    if (note) out.note = note;
    if (ex) out.ex = ex;
    if (ipa) out.ipa = ipa;
    if (/^\d{4}-\d{2}-\d{2}$/.test(added)) out.added = added;

  // Ключ однакового слова: регістр, апострофи й зайві пробіли не роблять його новим словом
  PG.dictKey = (w) => String(w).toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s+/g, ' ').trim();
  // Налаштування й словник потрапляють у розмітку, тож вони мають бути саме числами, відомими рядками й чистими записами
  function tidy(s, pack) {
    const st = s.settings;
    st.voice = String(st.voice || '');
    st.rate = Math.min(1.2, Math.max(0.5, +st.rate || 0.9));
    st.strict = !!st.strict;
    st.newPerDay = Math.min(50, Math.max(0, Math.round(+st.newPerDay) || 0));
    if (!['mix', 'tl', 'uk'].includes(st.dir)) st.dir = 'mix';
    if (pack.variants && !pack.variants.some((x) => x.id === st.variant)) st.variant = pack.variants[0].id;
    if (pack.settings && pack.settings.tidy) pack.settings.tidy(st);
    if (!['new', 'az', 'due'].includes(s.ui.dictSort)) s.ui.dictSort = 'new';
    const seen = new Set();
    s.dict = (Array.isArray(s.dict) ? s.dict : []).map(PG.cleanWord).filter((w) => w && !seen.has(PG.dictKey(w.word)) && seen.add(PG.dictKey(w.word)));
    return s;
  }
  PG.tidyLang = (obj, pack) => tidy(merge(defaults(pack), migrate(obj, pack)), pack);

  // newer — прогрес записала новіша версія тренажера: тоді нічого не записуємо, щоб старий код його не зіпсував;
  // broken — збережене не вдалося прочитати; failed — останній запис не вдався
  PG.store = { key: null, newer: false, broken: null, failed: null };
  function loadLang(code) {
    const pack = PG.pack(code), key = PG.langKey(code);
    PG.store = { key, newer: false, broken: null, failed: null };
    let raw = null;
    try { raw = localStorage.getItem(key); } catch (e) { PG.store.broken = e; console.warn('Сховище недоступне', e); return defaults(pack); }
    if (!raw) return defaults(pack);
    try {
      const data = parseObj(raw);
      PG.store.newer = (+data.v || 1) > LANG_VERSION;
      return PG.tidyLang(data, pack);
    } catch (e) {
      // Наступне збереження затерло б пошкоджений запис, тому копія лишається поруч для ручного відновлення
      PG.store.broken = e;
      console.warn('Не вдалося прочитати прогрес; копію збережено під ключем ' + key + '-broken', e);
      try { localStorage.setItem(key + '-broken', raw); } catch (e2) { console.warn(e2); }
      return defaults(pack);
    }
  }

  PG.A = loadApp();
  PG.reloadApp = () => { PG.A = loadApp(); };
  PG.S = null;
  PG.L = null;
  PG.code = null;
  let warnedAt = 0;
  PG.save = function () {
    if (!PG.S || PG.store.newer) return;
    try {
      localStorage.setItem(PG.store.key, JSON.stringify(PG.S));
      PG.store.failed = null;
    } catch (e) {
      PG.store.failed = e;
      console.warn('Прогрес не збережено', e);
      if (Date.now() - warnedAt > 60000 && document.body) {
        warnedAt = Date.now();
        PG.toast('⚠️ Прогрес не зберігся (' + (e && e.name || e) + '). Подробиці — у ⚙️ «Налаштування».', 6000);
      }
    }
  };
  // Зберігається завжди весь стан мови, тож без перечитування наступне збереження тут затерло б те, що записала
  // інша вкладка чи встановлений додаток. Мову цієї вкладки чужий вибір не змінює: його відкриє лише наступний запуск.
  window.addEventListener('storage', (e) => {
    if (e.key === APP_KEY || e.key === null) { const lang = PG.A.lang; PG.A = loadApp(); if (PG.code) PG.A.lang = lang; }
    if (PG.code && (e.key === PG.store.key || e.key === null)) {
      PG.S = loadLang(PG.code);
      if (PG.onExternalChange) PG.onExternalChange();
    }
  });

  // persisted: true — браузер не видалить дані сайту сам, навіть коли забракне місця; false — може; null — невідомо.
  // Chrome вирішує без запитання: зазвичай дозволяє встановленим додаткам, закладкам і сайтам, якими часто користуються.
  PG.Storage = {
    persisted: null, listeners: [],
    async check(ask) {
      const st = navigator.storage;
      if (!st || !st.persisted) return this.persisted;
      try {
        let p = await st.persisted();
        if (!p && ask && st.persist) p = await st.persist();
        this.persisted = !!p;
      } catch (e) { this.persisted = null; }
      this.listeners.forEach((f) => f());
      return this.persisted;
    }
  };
  PG.isInstalled = () => !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  // Chrome віддає подію beforeinstallprompt один раз; зберігаємо її, щоб кнопка «Встановити» спрацювала пізніше
  PG.Install = {
    prompt: null, listeners: [],
    notify() { this.listeners.forEach((f) => f()); },
    async run() {
      const p = this.prompt; if (!p) return;
      this.prompt = null;
      p.prompt();
      try { await p.userChoice; } catch (e) { console.warn(e); }
      this.notify();
    }
  };
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); PG.Install.prompt = e; PG.Install.notify(); });
  window.addEventListener('appinstalled', () => { PG.Install.prompt = null; PG.Storage.check(true); PG.Install.notify(); });
  PG.replaceState = function (obj) { PG.S = PG.tidyLang(clone(obj), PG.L); PG.save(); };
  PG.resetState = function () { PG.S = defaults(PG.L); PG.save(); };
  // Часткові скидання зберігають налаштування і мій словник
  PG.resetLessons = function () { PG.S.lessons = {}; PG.S.modules = {}; PG.save(); };
  PG.resetWords = function () { PG.S.cards = {}; PG.S.newDay = { day: 0, count: 0 }; PG.save(); };

  // Номер дня рахується за місцевим часом: інакше заняття о пів на першу ночі потрапляло б у вчорашній день
  PG.today = function () {
    const d = new Date();
    return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
  };
  PG.dayOfWeek = function (dayNum) { return new Date(dayNum * 86400000).getUTCDay(); }; // 0 = неділя
  PG.isoDay = (dayNum) => new Date(dayNum * 86400000).toISOString().slice(0, 10);
  PG.logActivity = function (kind, n) {
    const t = PG.today();
    const d = PG.S.days[t] || (PG.S.days[t] = { ex: 0, cards: 0, speak: 0 });
    d[kind] = (d[kind] || 0) + (n || 1);
    if (!PG.S.start) PG.S.start = t;
    PG.save();
  };
  // Вихідні не розривають серію: навчання заплановано лише на робочі дні
  PG.streakOf = function (days) {
    const t = PG.today();
    let day = t, count = 0;
    if (!days[t]) day = t - 1;
    for (let i = 0; i < 800; i++, day--) {
      const active = !!days[day];
      const wd = PG.dayOfWeek(day);
      if (active) count++;
      else if (wd === 0 || wd === 6) continue;
      else break;
    }
    return count;
  };
  PG.streak = () => PG.streakOf(PG.S.days);

  PG.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  PG.shuffle = function (a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  // [[текст]] або [[текст|що озвучити]] → клікабельний фрагмент мови навчання. Лише для даних уроків: вони вже є HTML
  PG.rich = function (html) {
    return String(html || '').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, shown, said) =>
      '<span class="say" data-say="' + PG.esc(String(said || shown).replace(/<[^>]+>/g, '')) + '">' + shown + '</span>');
  };
  // Для тексту, який увів учень (мій словник, імпорт), екрануються і показане, і озвучуване
  PG.sayHtml = (shown, said) => '<span class="say" data-say="' + PG.esc(said == null ? shown : said) + '">' + PG.esc(shown) + '</span>';
  // Примітки в дужках («(m)», «(US)») не озвучуються, а «flat / apartment» звучить як перелік
  PG.sayText = (s) => String(s).replace(/\s\/\s/g, ', ').replace(/\s*\([^)]*\)/g, '').trim();
  PG.toast = function (msg, ms) {
    let el = document.getElementById('toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), ms || 2200);
  };
  // Телефон чи планшет: там екранна клавіатура закриває пів екрана, а підказки про клавіші не мають сенсу
  PG.touch = () => !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  // Для порівняння перекладів і пошуку, а не відповідей: відповіді перевіряє мовний пакет (PG.check),
  // бо правила різні (скорочення, діакритика)
  PG.norm = (s) => String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/[.,!?;:"„“”«»()…–—-]/g, ' ').replace(/\s+/g, ' ').trim();
  // Пошук без діакритики: учень без словацької розкладки теж має знайти «môcť», набравши «moct»
  PG.fold = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  // Одна описка (пропущена, зайва, змінена чи переставлена буква) у слові з 6+ літер, коли останні дві літери збігаються:
  // так «beatiful» — майже, а «work» замість «works» чи «studies» замість «studied» — помилка граматики, а не описка.
  // Спільне для пакетів, щоб «майже» в усіх мовах означало те саме
  PG.oneTypo = function (a, b) {
    if (a === b || Math.min(a.length, b.length) < 5 || Math.max(a.length, b.length) < 6 || Math.abs(a.length - b.length) > 1) return false;
    if (a.slice(-2) !== b.slice(-2)) return false;
    let i = 0;
    while (i < a.length && a[i] === b[i]) i++;
    if (a.length === b.length) {
      if (a.slice(i + 1) === b.slice(i + 1)) return true;
      return a[i] === b[i + 1] && a[i + 1] === b[i] && a.slice(i + 2) === b.slice(i + 2);
    }
    const [l, s] = a.length > b.length ? [a, b] : [b, a];
    return l.slice(i + 1) === s.slice(i);
  };
  // Лише одне слово з опискою на речення: дві описки — це вже не неуважність, а незнання
  PG.nearTypo = function (x, y) {
    const a = x.split(' '), b = y.split(' ');
    if (a.length !== b.length) return false;
    let diff = 0;
    for (let k = 0; k < a.length; k++) if (a[k] !== b[k]) { if (++diff > 1 || !PG.oneTypo(a[k], b[k])) return false; }
    return diff === 1;
  };
  PG.cap =(s) => (s ? s[0].toUpperCase() + s.slice(1) : s);

  // Варіанти мови (американська / британська англійська тощо) задає пакет; у мови без варіантів список порожній
  PG.variants = () => (PG.L && PG.L.variants) || [];
  PG.variant = function () {
    const vs = PG.variants();
    if (!vs.length) return null;
    const v = PG.S && PG.S.settings.variant;
    return vs.some((x) => x.id === v) ? v : vs[0].id;
  };
  PG.variantInfo = (id) => PG.variants().find((x) => x.id === id) || null;
  PG.otherVariant = (v) => { const o = PG.variants().find((x) => x.id !== (v || PG.variant())); return o ? o.id : null; };
  // {{варіант1|варіант2}} у змісті уроку: показується варіант учня. Розбір знає про [[показати|озвучити]] усередині
  function resolveTokens(s, v, both) {
    if (s.indexOf('{{') < 0) return s;
    const vs = PG.variants(), at0 = Math.max(0, vs.findIndex((x) => x.id === v));
    let out = '', i = 0;
    while (i < s.length) {
      const at = s.indexOf('{{', i);
      if (at < 0) { out += s.slice(i); break; }
      out += s.slice(i, at);
      let depth = 0, j = at + 2;
      const bars = [];
      for (; j < s.length; j++) {
        if (s.startsWith('[[', j)) { depth++; j++; } else if (s.startsWith(']]', j)) { depth--; j++; } else if (s[j] === '|' && !depth) bars.push(j);
        else if (s.startsWith('}}', j) && !depth) break;
      }
      if (j >= s.length || bars.length !== Math.max(1, vs.length - 1)) throw new Error('Погана розмітка {{…|…}}: ' + s.slice(at, at + 60));
      const parts = [], cuts = [at + 1].concat(bars, [j]);
      for (let k = 0; k < cuts.length - 1; k++) parts.push(s.slice(cuts[k] + 1, cuts[k + 1]));
      const mine = parts[at0];
      out += mine;
      if (both) parts.forEach((p, k) => { if (k !== at0 && p && p !== mine) out += ' <span class="vv">' + PG.esc(vs[k].tag) + ' ' + p + '</span>'; });
      i = j + 2;
    }
    return out;
  }
  /**
   * Текст змісту під варіант учня: розмітка {{…|…}} і правопис (pack.spell). opts.nv — без зміни правопису (вправа саме про різницю);
   * opts.both — у розмітці показати й інший варіант дрібно («apartment UK flat») — для слів і приміток
   */
  PG.v = function (text, v, opts) {
    if (text == null || !PG.variants().length) return text;
    v = v || PG.variant();
    opts = opts || {};
    let s = resolveTokens(String(text), v, opts.both);
    if (!opts.nv && PG.L.spell) s = PG.L.spell(s, v);
    return s;
  };
  // Слово уроку: [слово, переклад, примітка, {<варіант>: слово}?] → { mine, other, note } — other лише якщо відрізняється
  PG.vWord = function (w, v) {
    if (!PG.variants().length) return { mine: w[0], other: '', note: w[2] || '' };
    v = v || PG.variant();
    const o = PG.otherVariant(v);
    const pick = (x) => (w[3] && w[3][x]) || PG.v(w[0], x);
    const mine = pick(v), other = o ? pick(o) : mine;
    return { mine, other: other !== mine ? other : '', note: PG.v(w[2] || '', v, { both: true }) };
  };
  // Вправа під варіант учня. Відповіді приймаються в усіх варіантах: учень з американським вибором може знати британське слово
  PG.vSpec = function (spec, v) {
    const it = Object.assign({}, spec);
    if (spec.t === 'g' || !PG.variants().length) return it;
    v = v || PG.variant();
    const opt = { nv: spec.nv };
    for (const k of ['q', 'e', 'h', 'say']) if (it[k]) it[k] = PG.v(it[k], v, opt);
    if (it.t === 'c') it.o = it.o.map((x) => PG.v(x, v, opt));
    else if (it.a != null) {
      const list = Array.isArray(it.a) ? it.a : [it.a], mine = list.map((x) => PG.v(x, v, opt));
      let all = mine;
      if (it.t !== 'o') for (const o of PG.variants()) if (o.id !== v) all = all.concat(list.map((x) => PG.v(x, o.id, opt)));
      all = Array.from(new Set(all));
      it.a = all.length > 1 ? all : all[0];
    }
    return it;
  };

  // 'ok' | 'near' (майже: описка чи діакритика — зараховується, якщо не ввімкнено суворий режим) | 'bad'.
  // Правила в кожної мови свої (скорочення й правопис US/UK, діакритика), тому перевіряє мовний пакет
  PG.check = (input, answers, exact) => PG.L.check(input, answers, exact);

  // Два рушії озвучення: 1) голос системи мови навчання (Web Speech API, працює й офлайн); 2) онлайн-голос Google
  // (потрібен інтернет) — коли голосу цієї мови чи варіанта в системі немає або учень вибрав його сам.
  // Текст ніколи не віддаємо голосу іншої мови: браузер прочитав би словацьке слово з англійською вимовою.
  const ONLINE = '@online';   // значення settings.voice для онлайн-голосу; '' — вибір автоматично
  const ONLINE_URLS = [       // друга адреса — запасна, якщо перша не відповіла
    (q, tl) => 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=' + tl + '&q=' + encodeURIComponent(q),
    (q, tl) => 'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=' + tl + '&q=' + encodeURIComponent(q)
  ];
  // Онлайн-сервіс приймає до ~200 символів за запит: ріжемо за реченнями, а задовгі речення — між словами
  PG.ttsChunks = function (text, max) {
    const out = [];
    let cur = '';
    for (const w of String(text).replace(/\s+/g, ' ').trim().split(' ')) {
      if (cur && (cur + ' ' + w).length > max) { out.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w;
      if (/[.!?…]$/.test(cur) && cur.length > max / 2) { out.push(cur); cur = ''; }
    }
    if (cur) out.push(cur);
    return out;
  };
  // Нейронні голоси (Edge «Natural», Google, Apple «Premium / Enhanced») звучать набагато природніше за старі системні
  const quality = (v) => (/natural|neural/i.test(v.name) ? 3 : /google|premium|enhanced|siri/i.test(v.name) ? 2 : v.localService ? 1 : 0);
  // Голос en-AU чи en-IE не належить жодному варіанту ('other'), але для англійської він кращий за онлайн-голос
  const accentOf = (voice) => { const x = PG.variants().find((vr) => vr.voice && vr.voice.test(voice.lang)); return x ? x.id : 'other'; };
  PG.TTS = {
    ONLINE,
    voices: [],
    ready: false, settled: false, listeners: [],
    system: 'speechSynthesis' in window,
    audio: null,
    token: 0,                 // події застарілого озвучення (після нового say) мають ігноруватися
    accentOf,
    init() {
      const notify = () => this.listeners.forEach((f) => f());
      window.addEventListener('online', notify);
      window.addEventListener('offline', notify);
      if (!this.system) { this.ready = this.settled = true; notify(); return; }
      speechSynthesis.onvoiceschanged = () => { this.load(); notify(); };
      this.load();
      notify();
      setTimeout(() => { this.settled = true; this.load(); notify(); }, 1500);
    },
    // Список голосів залежить від мови навчання, тож після зміни мови його перечитують
    load() {
      const re = PG.L && PG.L.tts && PG.L.tts.voices;
      this.voices = !this.system || !re ? [] : speechSynthesis.getVoices().filter((v) => v && v.lang && re.test(v.lang) && v.name && v.name !== 'undefined')
        .sort((a, b) => quality(b) - quality(a));
      this.ready = true;
    },
    // Голос системи для варіанта, яким говоримо зараз, або null — тоді говорить онлайн-голос
    voice(variant) {
      const v = this.voices, want = PG.S.settings.voice, cur = PG.variant();
      variant = variant || cur;
      if (variant === cur) {
        if (want === ONLINE) return null;
        // Вибраний голос іншого варіанта не має «перебивати» варіант: британське слово мусить звучати по-британськи
        const chosen = v.find((x) => x.name === want);
        if (chosen && (!variant || accentOf(chosen) === variant || accentOf(chosen) === 'other')) return chosen;
      }
      return (variant ? v.find((x) => accentOf(x) === variant) : v[0]) || null;
    },
    onlineLang(variant) { const vi = PG.variantInfo(variant || PG.variant()); return (vi && vi.online) || PG.L.tts.online; },
    label(variant) {
      const v = this.voice(variant);
      if (v) return v.name;
      const vi = PG.variantInfo(variant || PG.variant());
      return 'Google — ' + (vi ? vi.name + ' вимова' : PG.L.names.nom) + ', онлайн';
    },
    // true — озвучити нічим: голосу мови в системі немає, а інтернету для онлайн-голосу теж немає
    silent() { return this.settled && !this.voices.length && navigator.onLine === false; },
    stop() {
      this.token++;
      if (this.system) speechSynthesis.cancel();
      if (this.audio) this.audio.pause();
    },
    // variant — щоб послухати слово з іншим акцентом; без нього — з налаштувань
    say(text, rate, variant) {
      if (!text || !PG.L) return;
      this.stop();
      rate = rate || PG.S.settings.rate || 0.9;
      variant = variant || PG.variant();
      const v = this.voice(variant);
      if (v) this.sayLocal(text, rate, v); else this.sayOnline(text, rate, variant);
    },
    sayLocal(text, rate, v) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = v.lang || PG.L.tts.lang;
      u.voice = v;
      u.rate = rate;
      speechSynthesis.speak(u);
    },
    sayOnline(text, rate, variant) {
      const parts = PG.ttsChunks(text, 180), token = this.token, tl = this.onlineLang(variant);
      // Один <audio> на всю сесію: Safari дозволяє вже «розблокованому» елементу грати без нового натискання
      const a = this.audio || (this.audio = new Audio());
      let i = 0, url = 0;
      const play = () => {
        a.src = ONLINE_URLS[url](parts[i], tl);
        a.defaultPlaybackRate = a.playbackRate = rate;   // нове src скидає швидкість, тому лише після нього
        a.play().catch((e) => { if (token === this.token && e && e.name === 'NotAllowedError') PG.toast('Натисніть 🔊, щоб послухати'); });
      };
      a.onended = () => { if (token === this.token && ++i < parts.length) play(); };
      a.onerror = () => {
        if (token !== this.token) return;
        if (++url < ONLINE_URLS.length) { play(); return; }
        const v = this.voices[0];
        if (v) { this.sayLocal(parts.slice(i).join(' '), rate, v); return; }   // без інтернету рятує будь-який голос цієї мови
        PG.toast('🔇 Онлайн-голос недоступний (немає інтернету?), а ' + PG.L.names.adjGen + ' голосу в системі немає. Див. ⚙️ «Налаштування».');
      };
      play();
    },
    // Запис живої людини зі словника — звичайний аудіофайл, без синтезу
    playUrl(url, rate) {
      this.stop();
      const a = this.audio || (this.audio = new Audio()), token = this.token;
      a.onended = null;
      a.onerror = () => { if (token === this.token) PG.toast('Запис носія не завантажився (немає інтернету?)'); };
      a.src = url;
      a.defaultPlaybackRate = a.playbackRate = rate || 1;
      a.play().catch(() => {});
    }
  };

  PG.Rec = {
    mr: null, url: null,
    supported: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder),
    async start(onStop, onError) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const chunks = [];
        this.mr = new MediaRecorder(stream);
        this.mr.ondataavailable = (e) => chunks.push(e.data);
        this.mr.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          if (this.url) URL.revokeObjectURL(this.url);
          this.url = URL.createObjectURL(new Blob(chunks, { type: this.mr.mimeType || 'audio/webm' }));
          onStop(this.url);
        };
        this.mr.start();
      } catch (e) { onError(e); }
    },
    stop() { if (this.mr && this.mr.state !== 'inactive') this.mr.stop(); },
    active() { return !!(this.mr && this.mr.state === 'recording'); }
  };

  PG.recorderWidget = function (container) {
    if (!PG.Rec.supported) {
      container.innerHTML = '<span class="small muted">Запис голосу недоступний у цьому браузері.</span>';
      return;
    }
    container.innerHTML = '<button class="btn rec-btn">● Записати себе</button> <audio class="rec-audio" controls style="display:none;vertical-align:middle;max-width:260px"></audio>';
    const btn = container.querySelector('.rec-btn');
    const audio = container.querySelector('.rec-audio');
    btn.onclick = () => {
      if (PG.Rec.active()) { PG.Rec.stop(); return; }
      PG.Rec.start((url) => {
        btn.textContent = '● Записати ще раз';
        audio.src = url; audio.style.display = '';
        PG.logActivity('speak');
      }, (e) => {
        btn.textContent = '● Записати себе';
        PG.toast('Немає доступу до мікрофона: ' + (e && e.name ? e.name : e));
      });
      btn.textContent = '■ Зупинити запис';
    };
  };

  // У зібраній версії (docs/) пакет — один файл langs/<код>.<відбиток>.js (PG.BUNDLES від build.mjs): відбиток у назві
  // не дає HTTP-кешу підсунути старий пакет до нового рушія. У src/ (розробка) файли пакета вантажаться по одному.
  const loading = {};
  PG.loadPack = function (code) {
    const info = PG.langInfo(code);
    if (!info) return Promise.reject(new Error('Невідома мова: ' + code));
    if (PG.packs[code] && PG.packs[code].loaded) return Promise.resolve(PG.packs[code]);
    if (loading[code]) return loading[code];
    const urls = PG.BUNDLES ? [PG.BUNDLES[code]] : info.files.map((f) => 'langs/' + code + '/' + f);
    loading[code] = new Promise((resolve, reject) => {
      let left = urls.length, failed = false;
      urls.forEach((src) => {
        const s = document.createElement('script');
        s.src = src;
        s.async = false;   // порядок виконання = порядок файлів у реєстрі, а він же — порядок уроків
        s.onload = () => { if (!failed && --left === 0) { delete loading[code]; PG.pack(code).loaded = true; resolve(PG.pack(code)); } };
        s.onerror = () => {
          if (failed) return;
          failed = true;
          // Частково виконаний пакет мав би половину уроків, а повторна спроба додала б їх удруге
          delete PG.packs[code]; delete loading[code];
          reject(new Error('Не вдалося завантажити ' + src + ' (немає інтернету?)'));
        };
        document.head.appendChild(s);
      });
    });
    return loading[code];
  };
  // Окремо від activate, бо validate.mjs виконує файли пакета в Node сам і завантажувати нічого не треба
  PG.useLang = function (code) {
    const pack = PG.packs[code];
    if (!pack) throw new Error('Пакет «' + code + '» не завантажено');
    PG.L = pack;
    PG.code = code;
    PG.lessons = pack.lessons;
    PG.program = pack.program;
    PG.ref = pack.ref || [];
    PG.resources = pack.resources || [];
    PG.gen = pack.gen;
    firstOf = null;
    PG.S = loadLang(code);
    return pack;
  };
  PG.activate = async function (code) {
    await PG.loadPack(code);
    PG.useLang(code);
    PG.A.lang = code;
    PG.saveApp();
    PG.TTS.load();
  };
  // Екран вибору мови показує підсумок кожної мови, не завантажуючи її пакет: лише зі збереженого запису
  PG.langSummary = function (code) {
    let s = null;
    if (code === PG.code) s = PG.S;
    else { const raw = readRaw(PG.langKey(code)); if (raw) try { s = parseObj(raw); } catch (e) { s = null; } }
    if (!s) return null;
    const ls = Object.values(s.lessons && typeof s.lessons === 'object' ? s.lessons : {});
    const days = s.days && typeof s.days === 'object' ? s.days : {};
    const last = Object.keys(days).map(Number).filter(isFinite).sort((a, b) => b - a)[0];
    return {
      done: ls.filter((x) => x && x.ex && x.ex.done).length,
      skipped: ls.filter((x) => x && x.skipped && !(x.ex && x.ex.done)).length,
      words: Object.values(s.cards || {}).filter((c) => c && c.reps > 0).length,
      dict: Array.isArray(s.dict) ? s.dict.length : 0,
      streak: PG.streakOf(days),
      last: last == null ? null : last
    };
  };

  PG.lessons = [];
  PG.lessonById = (id) => PG.lessons.find((l) => l.id === id);
  PG.lessonState = function (id) { return PG.S.lessons[id] || (PG.S.lessons[id] = {}); };
  // Стан уроку: {opened, theory, ex:{best,done}, speak, mission, skipped, run}
  //   done    — вправи виконано на ≥ 80%;  skipped — учень пропустив урок («вже знаю» / «почати з іншого уроку»);
  //   run     — незавершений підхід до вправ (див. exercises.js), щоб продовжити пізніше
  PG.lessonDone = (id) => !!(PG.S.lessons[id] && PG.S.lessons[id].ex && PG.S.lessons[id].ex.done);
  PG.lessonSkipped = (id) => !!(PG.S.lessons[id] && PG.S.lessons[id].skipped) && !PG.lessonDone(id);
  PG.lessonClosed = (id) => PG.lessonDone(id) || PG.lessonSkipped(id);
  PG.currentLesson = function () { return PG.lessons.find((l) => !PG.lessonClosed(l.id)) || PG.lessons[PG.lessons.length - 1]; };
  PG.skipLesson = function (id, on) { const st = PG.lessonState(id); if (on) st.skipped = true; else delete st.skipped; PG.save(); };
  // «Пройти наново» скидає позначки й вправи, але слова уроку лишаються в повторенні
  PG.resetLesson = function (id) { const st = PG.lessonState(id); ['theory', 'ex', 'speak', 'mission', 'skipped', 'run'].forEach((k) => delete st[k]); PG.save(); };
  PG.startFrom = function (id) {
    for (const l of PG.lessons) { if (l.id === id) break; if (!PG.lessonDone(l.id)) PG.lessonState(l.id).skipped = true; }
    delete PG.lessonState(id).skipped;
    PG.save();
  };

  PG.cardId = (lessonId, word) => lessonId + '|' + word;
  // Слово, що є в кількох уроках, — одна картка з id за першим уроком, де воно з'являється. Так id не залежить від того,
  // який урок учень відкрив першим, і прогрес слова не губиться
  let firstOf = null;
  function firstMap(pack) {
    const m = new Map();
    (pack.lessons || []).forEach((l) => (l.vocab || []).forEach((w) => { const k = w[0].toLowerCase(); if (!m.has(k)) m.set(k, [l.id, w[0]]); }));
    return m;
  }
  const firstLesson = (word) => (firstOf || (firstOf = firstMap(PG.L))).get(word.toLowerCase());
  // Слова з уроків, які учень уже відкривав, + мій словник. only: 'my' — лише мій словник
  PG.allWords = function (only) {
    const out = [], seen = new Set();
    if (only !== 'my') PG.lessons.forEach((l) => {
      if (!(PG.S.lessons[l.id] && PG.S.lessons[l.id].opened)) return;
      (l.vocab || []).forEach((w) => {
        const [lid, word] = firstLesson(w[0]) || [l.id, w[0]], id = PG.cardId(lid, word);
        if (seen.has(id)) return;
        seen.add(id);
        const vw = PG.vWord(w);
        out.push({ id, word: vw.mine, alt: vw.other, uk: w[1], note: vw.note, lesson: l.id });
      });
    });
    PG.S.dict.forEach((w) => out.push({ id: PG.cardId('my', w.word), word: w.word, uk: w.uk, note: w.note || '', ipa: w.ipa || '', ex: w.ex || '', au: w.au, lesson: 'my' }));
    return out;
  };
  PG.srsQueue = function (only) {
    const t = PG.today();
    const words = PG.allWords(only);
    const due = PG.shuffle(words.filter((w) => PG.S.cards[w.id] && PG.S.cards[w.id].due <= t));
    if (PG.S.newDay.day !== t) PG.S.newDay = { day: t, count: 0 };
    const room = Math.max(0, (PG.S.settings.newPerDay || 10) - PG.S.newDay.count);
    const fresh = words.filter((w) => !PG.S.cards[w.id]).slice(0, room);
    return { due, fresh, total: due.length + fresh.length };
  };
  PG.srsCounts = function (only) {
    const t = PG.today();
    const words = PG.allWords(only);
    const due = words.filter((w) => PG.S.cards[w.id] && PG.S.cards[w.id].due <= t).length;
    const known = words.filter((w) => PG.S.cards[w.id] && PG.S.cards[w.id].reps > 0).length;
    const unseen = words.filter((w) => !PG.S.cards[w.id]).length;
    return { due, known, unseen, all: words.length };
  };
  function nextInterval(c, grade) {
    if (c.reps === 0) return grade === 4 ? 3 : 1;
    if (c.reps === 1) return grade === 2 ? 2 : grade === 4 ? 6 : 4;
    return Math.round(c.int * (grade === 2 ? 1.2 : grade === 4 ? c.ease * 1.3 : c.ease));
  }
  // grade: 1 знову, 2 важко, 3 добре, 4 легко
  PG.srsGrade = function (word, grade) {
    const t = PG.today();
    let c = PG.S.cards[word.id];
    if (!c) {
      c = PG.S.cards[word.id] = { due: t, int: 0, ease: 2.5, reps: 0, lapses: 0 };
      if (PG.S.newDay.day !== t) PG.S.newDay = { day: t, count: 0 };
      PG.S.newDay.count++;
    }
    if (grade === 1) {
      c.lapses++; c.reps = 0; c.int = 0; c.ease = Math.max(1.3, c.ease - 0.2); c.due = t;
    } else {
      const next = nextInterval(c, grade);
      if (grade === 2) c.ease = Math.max(1.3, c.ease - 0.15);
      if (grade === 4) c.ease += 0.15;
      c.int = Math.max(1, next); c.reps++; c.due = t + c.int;
    }
    PG.logActivity('cards');
    PG.save();
  };
  PG.nextIntervalLabel = function (word, grade) {
    if (grade === 1) return 'сьогодні';
    const next = Math.max(1, nextInterval(PG.S.cards[word.id] || { int: 0, ease: 2.5, reps: 0 }, grade));
    return next < 30 ? next + ' дн.' : Math.round(next / 30) + ' міс.';
  };
})(window.PG);

</script>
<script>
/* Рушій вправ: c — вибір (перший варіант правильний), i — введення, o — порядок слів, l — диктант, g — генерована (gen.js пакета) */
(function (PG) {
  'use strict';
  const esc = PG.esc;
  const shown = (a) => (Array.isArray(a) ? a[0] : a);

  // Клавіатура з літерами мови (pack.keyboard): без місцевої розкладки інакше не набрати á, ä, č…
  PG.letterKeyboard = function (getInput) {
    const letters = PG.L.keyboard;
    if (!letters || !letters.length) return null;
    const wrap = document.createElement('div');
    wrap.className = 'dia';
    let upper = false;
    const draw = () => {
      wrap.innerHTML = letters.map((ch) => '<button type="button" data-ch="' + esc(ch) + '">' + esc(upper ? ch.toUpperCase() : ch) + '</button>').join('') +
        '<button type="button" data-shift="1" title="Великі літери">⇧</button>';
    };
    draw();
    // mousedown не забирає фокус з поля вводу, інакше курсор зникав би після кожної літери
    wrap.addEventListener('mousedown', (e) => e.preventDefault());
    wrap.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.shift) { upper = !upper; draw(); return; }
      const inp = getInput(); if (!inp) return;
      const ch = upper ? b.dataset.ch.toUpperCase() : b.dataset.ch;
      const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? inp.value.length;
      inp.value = inp.value.slice(0, s) + ch + inp.value.slice(en);
      inp.focus(); inp.setSelectionRange(s + 1, s + 1);
    });
    return wrap;
  };

  /**
   * specs — вправи; opts.onFinish(score%), opts.drill (без «урок зараховано»),
   * opts.saveKey — id уроку: тоді незавершений підхід зберігається в стані уроку (run) і його можна продовжити пізніше.
   * run = { n: кількість вправ, q: [[індекс, повтор?], …], pos, ft: {індекс: правильно з першої спроби?}, sk: {індекс: пропущено} }
   */
  PG.runExercises = function (root, specs, opts) {
    opts = opts || {};
    const lst = opts.saveKey ? PG.lessonState(opts.saveKey) : null;
    const last = {}; // останній показаний варіант кожної вправи: генеровані щоразу нові, а підсумок має показати саме той
    // Варіант мови застосовується під час показу: учень може перемкнути його посеред підходу
    const make = (i) => (last[i] = Object.assign(specs[i].t === 'g' ? PG.gen.make(specs[i]) : PG.vSpec(specs[i]), { _i: i }));
    const fresh = () => ({ n: specs.length, q: PG.shuffle(specs.map((_, i) => [i, 0])), pos: 0, ft: {}, sk: {} });
    const save = () => { if (lst) { lst.run = run; PG.save(); } };
    const clear = () => { if (lst) { delete lst.run; PG.save(); } };
    let run;

    const saved = lst && lst.run && lst.run.n === specs.length && Array.isArray(lst.run.q) && (lst.run.pos > 0 || Object.keys(lst.run.ft || {}).length) && lst.run.pos < lst.run.q.length ? lst.run : null;
    if (saved && !opts.forceNew) {
      const answered = Object.keys(saved.ft).length;
      root.innerHTML = '<div class="ex-box card center"><h3>⏸ Незавершений підхід</h3><p>Ви вже виконали <b>' + answered + ' з ' + specs.length + '</b> завдань цього уроку.</p>' +
        '<div class="row" style="justify-content:center"><button class="btn primary cont">▶ Продовжити</button><button class="btn restart">↺ Почати заново</button></div></div>';
      root.querySelector('.cont').onclick = () => { run = saved; next(); };
      root.querySelector('.restart').onclick = () => { run = fresh(); save(); next(); };
      return;
    }
    run = fresh();
    if (lst) delete lst.run;

    function finish() {
      const total = specs.length;
      const ok = Object.values(run.ft).filter(Boolean).length;
      const skipped = Object.keys(run.sk).length;
      const score = total ? Math.round((ok / total) * 100) : 0;
      const wrong = Object.keys(run.ft).filter((i) => run.ft[i] === false).map((i) => last[i] || make(+i));
      clear();
      root.innerHTML = '<div class="ex-box card center">' +
        '<h2>' + (score >= 80 ? '🎉 Чудово!' : score >= 60 ? '👍 Непогано!' : '💪 Варто повторити') + '</h2>' +
        '<div class="stat">' + score + '%</div><p class="muted">правильно з першої спроби: ' + ok + ' з ' + total + (skipped ? ' · пропущено: ' + skipped : '') + '</p>' +
        (opts.drill ? '' : score >= 80 ? '<p class="good">Урок зараховано (потрібно ≥ 80%).</p>' : '<p class="note">Для зарахування потрібно ≥ 80%. Перечитайте теорію і спробуйте ще раз — це нормально. Якщо тему ви вже знаєте, урок можна пропустити кнопкою вгорі.</p>') +
        (wrong.length ? '<div class="small" style="text-align:left"><b>Де були помилки або пропуски:</b><ul>' + wrong.map((w) => '<li>' + esc(stripTags(w.q || w.h || 'Диктант')) + ' → <b>' + esc(answerText(w)) + '</b></li>').join('') + '</ul></div>' : '') +
        '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn primary again">Ще раз</button></div></div>';
      root.querySelector('.again').onclick = () => PG.runExercises(root, specs, Object.assign({}, opts, { forceNew: true }));
      if (opts.onFinish) opts.onFinish(score);
    }
    function stripTags(s) { return String(s).replace(/<[^>]+>/g, '').replace(/\[\[([^\]|]*)(?:\|[^\]]*)?\]\]/g, '$1'); }
    function answerText(it) { return it.t === 'c' ? (it.o[it.a || 0]) : shown(it.a); }

    function next() {
      if (run.pos >= run.q.length) return finish();
      const [i, retry] = run.q[run.pos];
      render(make(i), retry);
    }
    // skip — учень пропустив завдання: воно не повертається в кінець черги, бо відповідь він уже бачив
    function record(it, ok, skip) {
      if (!(it._i in run.ft)) run.ft[it._i] = ok;
      if (skip) run.sk[it._i] = 1;
      else if (!ok && !run.q[run.pos][1]) run.q.push([it._i, 1]);
      PG.logActivity('ex');
      save();
    }

    function render(it, retry) {
      PG._exCurrent = it; // для самоперевірки (tools/selftest-console.js)
      const progress = Math.round((run.pos / run.q.length) * 100);
      root.innerHTML = '<div class="ex-box card">' +
        '<div class="row small muted"><span>Завдання ' + (run.pos + 1) + ' з ' + run.q.length + (retry ? ' · повтор' : '') + '</span><span class="spacer"></span>' +
        (lst ? '<button class="btn small restart" title="Почати підхід заново">↺</button>' : '') + '<span class="pill gray">' + typeName(it.t) + '</span></div>' +
        '<div class="bar" style="margin:8px 0 12px"><i style="width:' + progress + '%"></i></div>' +
        '<div class="ex-body"></div><div class="fb"></div>' +
        '<div class="row" style="margin-top:12px"><button class="btn skip" title="Показати відповідь і перейти далі">Пропустити ⏭</button><span class="spacer"></span><button class="btn primary act">Перевірити</button></div>' +
        (lst ? '<p class="small muted" style="margin:8px 0 0">Прогрес підходу зберігається автоматично — можна закрити й продовжити пізніше.</p>' : '') + '</div>';
      const body = root.querySelector('.ex-body');
      const fb = root.querySelector('.fb');
      const act = root.querySelector('.act');
      const skipBtn = root.querySelector('.skip');
      let checked = false;
      const goNext = () => { run.pos++; save(); next(); };
      const showFb = (state, extra) => {
        const msg = state === 'ok' ? '✅ Правильно!' : state === 'near' ? PG.L.ui.near : state === 'skip' ? '⏭ Пропущено.' : '❌ Ні.';
        fb.innerHTML = '<div class="feedback ' + (state === 'skip' ? 'near' : state) + '">' + msg +
          (state !== 'ok' ? ' Правильно: <b>' + esc(answerText(it)) + '</b>' : '') +
          (it.e ? '<div class="small" style="margin-top:4px">' + PG.rich(it.e) + '</div>' : '') + (extra || '') + '</div>';
        act.textContent = 'Далі →'; act.style.display = ''; checked = true; skipBtn.style.display = 'none';
        act.onclick = goNext; act.focus();
      };
      const r = root.querySelector('.restart');
      if (r) r.onclick = () => {
        if (!r.dataset.sure) { r.dataset.sure = '1'; r.textContent = '↺ Точно почати заново?'; setTimeout(() => { r.dataset.sure = ''; r.textContent = '↺'; }, 3000); return; }
        run = fresh(); save(); next();
      };
      skipBtn.onclick = () => {
        if (checked) return;
        if (it.t === 'c') body.querySelectorAll('.opt').forEach((x) => { x.disabled = true; if (x.dataset.v === it.o[it.a || 0]) x.classList.add('ok'); });
        const inp = body.querySelector('.ans'); if (inp) inp.readOnly = true;
        record(it, false, true); showFb('skip');
      };

      if (it.t === 'c') {
        const correct = it.o[it.a || 0];
        body.innerHTML = '<div class="ex-q">' + PG.rich(it.q) + '</div><div class="opts">' +
          PG.shuffle(it.o).map((o) => '<button class="opt" data-v="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';
        act.style.display = 'none';
        body.querySelectorAll('.opt').forEach((b) => b.onclick = () => {
          if (checked) return;
          const ok = b.dataset.v === correct;
          body.querySelectorAll('.opt').forEach((x) => { x.disabled = true; if (x.dataset.v === correct) x.classList.add('ok'); });
          if (!ok) b.classList.add('bad');
          record(it, ok); showFb(ok ? 'ok' : 'bad');
        });
      } else if (it.t === 'i' || it.t === 'l') {
        body.innerHTML = it.t === 'l'
          ? '<div class="ex-q">🎧 ' + esc(it.h || 'Прослухайте й напишіть ' + PG.L.names.ins) + (it.q ? ': <span class="muted">' + esc(it.q) + '</span>' : '') + '</div>' +
            '<div class="row" style="margin-bottom:10px"><button class="btn play">🔊 Ще раз</button><button class="btn slow">🐢 Повільно</button><button class="btn small reveal">Не чути? Показати текст</button></div>'
          : '<div class="ex-q">' + PG.rich(it.q) + '</div>';
        // spellcheck вимкнено, бо підкреслення браузера підказувало б, де помилка; autocorrect і lang — щоб телефон
        // не «виправляв» слова мови навчання на українські. nodia — відповідь цифрами: цифрова клавіатура, без літер
        body.insertAdjacentHTML('beforeend', '<input type="text" class="ans" lang="' + (it.nodia ? 'uk' : PG.L.htmlLang) + '" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"' +
          (it.nodia ? ' inputmode="decimal"' : '') + ' placeholder="' + esc(it.ph || 'Ваша відповідь') + '">');
        const inp = body.querySelector('.ans');
        const kb = it.nodia ? null : PG.letterKeyboard(() => inp);
        if (kb) body.appendChild(kb);
        if (it.t === 'l') {
          const txt = it.say || shown(it.a);
          body.querySelector('.play').onclick = () => PG.TTS.say(txt);
          body.querySelector('.slow').onclick = () => PG.TTS.say(txt, 0.6);
          body.querySelector('.reveal').onclick = (e) => { e.target.outerHTML = '<span class="small muted">Текст: ' + esc(txt) + '</span>'; };
          setTimeout(() => PG.TTS.say(txt), 250);
        }
        // На телефоні автофокус відкриває екранну клавіатуру, і та закриває питання та кнопки 🔊 диктанту
        if (!PG.touch()) setTimeout(() => inp.focus(), 50);
        act.onclick = () => {
          if (checked) return;
          // check — власна перевірка генерованої вправи; nospace — пробіли не важливі (dvadsaťpäť = dvadsať päť)
          const nos = (s) => String(s).replace(/\s+/g, '');
          const list = Array.isArray(it.a) ? it.a : [it.a];
          const st = it.check ? it.check(inp.value) : it.nospace ? PG.check(nos(inp.value), list.map(nos), it.exact) : PG.check(inp.value, it.a, it.exact);
          const ok = st === 'ok' || (st === 'near' && !PG.S.settings.strict);
          inp.classList.add(ok ? 'ok' : 'bad'); inp.readOnly = true;
          record(it, ok); showFb(st, it.t === 'l' && it.tr ? '<div class="small">Переклад: ' + esc(it.tr) + '</div>' : '');
        };
        inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); act.click(); } });
      } else if (it.t === 'o') {
        const target = shown(it.a);
        const pool = target.split(' ');
        let order = PG.shuffle(pool);
        for (let k = 0; k < 5 && pool.length > 2 && order.join(' ') === target; k++) order = PG.shuffle(pool);
        const chosen = [];
        body.innerHTML = '<div class="ex-q">Складіть речення: <b>' + esc(it.q) + '</b></div>' +
          '<div class="tokens ans-area" title="Натисніть слово, щоб повернути"></div><div class="tokens pool" style="border-style:solid"></div>';
        const area = body.querySelector('.ans-area'), poolEl = body.querySelector('.pool');
        const draw = () => {
          area.innerHTML = chosen.map((w, k) => '<button class="tok" data-k="' + k + '">' + esc(w) + '</button>').join('') || '<span class="muted small">Натискайте слова внизу…</span>';
          poolEl.innerHTML = order.map((w, k) => '<button class="tok" data-k="' + k + '">' + esc(w) + '</button>').join('');
        };
        draw();
        area.onclick = (e) => { const b = e.target.closest('.tok'); if (!b || checked) return; order.push(chosen.splice(+b.dataset.k, 1)[0]); draw(); };
        poolEl.onclick = (e) => { const b = e.target.closest('.tok'); if (!b || checked) return; chosen.push(order.splice(+b.dataset.k, 1)[0]); draw(); };
        act.onclick = () => {
          if (checked) return;
          if (order.length) { PG.toast('Використайте всі слова'); return; }
          // Порядок слів перевіряється точно: описка тут неможлива, а «майже» означало б неправильний порядок.
          // Регістр — ні: плитки беруть велику літеру з першої відповіді («Ich»), а мова, що перевіряє регістр (німецька),
          // інакше не зарахувала б правильний інший порядок («Heute gehe ich»)
          const lc = (s) => String(s).toLowerCase();
          const ok = PG.check(lc(chosen.join(' ')), [].concat(it.a).map(lc), true) === 'ok';
          record(it, ok); showFb(ok ? 'ok' : 'bad', '<div class="row" style="margin-top:6px"><button class="btn small" onclick="PG.TTS.say(' + esc(JSON.stringify(target)) + ')">🔊 Послухати</button></div>');
        };
      }
    }
    function typeName(t) { return { c: 'вибір', i: 'напишіть', o: 'порядок слів', l: 'диктант' }[t] || t; }

    next();
  };
})(window.PG);

</script>
<script>
/* Мій словник: додавання, редагування, транскрипція й записи носіїв (якщо пакет мови їх уміє шукати), експорт та імпорт.
 * Розбір і злиття імпорту — без DOM, тому validate.mjs перевіряє їх у Node. Екрани — у dictview.js */
window.PG = window.PG || {};
(function (PG) {
  'use strict';
  const FORMAT = 'polyglot-dictionary';
  const FORMAT_VERSION = 1;
  const key = (w) => PG.dictKey(w);
  const cid = (w) => PG.cardId('my', w);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  // Ліміт захищає localStorage (~5 МБ на сайт, спільні для всіх мов) від випадково вставленого величезного файлу
  const MAX_WORDS = 20000;
  const L = () => PG.L.dict || {};

  const Dict = {
    FORMAT, MAX_WORDS,
    list() { return PG.S.dict; },
    index(word) { const k = key(word); return PG.S.dict.findIndex((w) => key(w.word) === k); },
    get(word) { return PG.S.dict[this.index(word)] || null; },
    canLookup() { return typeof L().lookup === 'function'; },

    // Повертає { ok, word } або { ok: false, reason: 'empty' | 'dup' | 'full', word? }
    add(fields) {
      const w = PG.cleanWord(Object.assign({}, fields, { added: PG.isoDay(PG.today()) }));
      if (!w) return { ok: false, reason: 'empty' };
      const old = this.get(w.word);
      if (old) return { ok: false, reason: 'dup', word: old };
      if (PG.S.dict.length >= MAX_WORDS) return { ok: false, reason: 'full' };
      PG.S.dict.push(w);
      PG.save();
      return { ok: true, word: w };
    },
    // Нове написання переносить і прогрес повторення: id картки містить саме слово
    update(oldWord, fields) {
      const i = this.index(oldWord);
      if (i < 0) return { ok: false, reason: 'missing' };
      const cur = PG.S.dict[i];
      const w = PG.cleanWord(Object.assign({}, cur, fields));
      if (!w) return { ok: false, reason: 'empty' };
      const j = this.index(w.word);
      if (j >= 0 && j !== i) return { ok: false, reason: 'dup', word: PG.S.dict[j] };
      if (w.word !== cur.word) {
        if (key(w.word) !== key(cur.word)) { delete w.ipa; delete w.au; }
        const card = PG.S.cards[cid(cur.word)];
        delete PG.S.cards[cid(cur.word)];
        if (card) PG.S.cards[cid(w.word)] = card;
      }
      PG.S.dict[i] = w;
      PG.save();
      return { ok: true, word: w };
    },
    remove(word) {
      const i = this.index(word);
      if (i < 0) return false;
      const w = PG.S.dict.splice(i, 1)[0];
      delete PG.S.cards[cid(w.word)];
      PG.save();
      return true;
    },
    clear() {
      for (const w of PG.S.dict) delete PG.S.cards[cid(w.word)];
      PG.S.dict = [];
      PG.save();
    },
    card(word) { return PG.S.cards[cid(word)] || null; },

    // undefined — сервіс не відповів; null — слова в базі немає (або мова не вміє шукати)
    async lookup(word) { return this.canLookup() ? L().lookup(word) : null; },
    // Слова без транскрипції чи запису (наприклад, після імпорту) доповнюються по черзі: у сервісу ліміт запитів
    missing() { return this.canLookup() ? PG.S.dict.filter((w) => !w.ipa).map((w) => w.word) : []; },
    async enrichAll(onStep, stop) {
      const list = this.missing();
      let fails = 0, found = 0;
      for (let i = 0; i < list.length && !(stop && stop()); i++) {
        const r = await this.enrich(list[i]);
        if (r === undefined) { if (++fails >= 3) break; } else { fails = 0; if (r) found++; }
        if (onStep) onStep(i + 1, list.length, found);
        await new Promise((ok) => setTimeout(ok, 250));
      }
      return { found, total: list.length, offline: fails >= 3 };
    },
    // Дописує транскрипцію (якщо її немає) і записи носіїв до слова зі словника
    async enrich(word) {
      const r = await this.lookup(word);
      if (!r) return r;
      const i = this.index(word);
      if (i < 0) return r;
      const w = PG.S.dict[i];
      const next = Object.assign({}, w, { ipa: w.ipa || r.ipa, au: r.au || w.au });
      PG.S.dict[i] = PG.cleanWord(next) || w;
      PG.save();
      return r;
    },
    // Запис носія потрібного варіанта, а якщо його немає — будь-який (австралійський теж краще за синтез)
    nativeUrl(w, variant) {
      const au = w && w.au;
      if (!au) return null;
      return (variant && au[variant]) || au[Object.keys(au)[0]] || null;
    },

    toJson(withProgress) {
      const words = PG.S.dict.map((w) => {
        const out = clone(w);
        const c = withProgress && this.card(w.word);
        if (c) out.card = clone(c);
        return out;
      });
      return JSON.stringify({ format: FORMAT, version: FORMAT_VERSION, app: 'Polyglot', lang: PG.code, exported: new Date().toISOString(), count: words.length, words }, null, 1);
    },
    toCsv() {
      const q = (s) => (/[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s);
      const rows = [[L().csvHeader || PG.code, 'ukrainian', 'note', 'example', 'ipa']].concat(PG.S.dict.map((w) => [w.word, w.uk, w.note || '', w.ex || '', w.ipa || '']));
      return rows.map((r) => r.map(q).join(',')).join('\r\n') + '\r\n';
    },
    // Табуляція — роздільник, який Excel і Google Таблиці розпізнають у будь-якій мовній локалі
    toTsv() {
      const t = (s) => String(s || '').replace(/[\t\r\n]+/g, ' ');
      return [PG.cap(PG.L.names.ins) + '\tУкраїнською\tПримітка\tПриклад\tТранскрипція'].concat(PG.S.dict.map((w) => [w.word, w.uk, w.note, w.ex, w.ipa].map(t).join('\t'))).join('\n');
    },
    fileName(ext) { return 'polyglot-' + PG.code + '-dictionary-' + PG.isoDay(PG.today()) + '.' + ext; },

    // Розбір імпорту → { kind, lang?, rows: [{word, uk, note?, ex?, ipa?, au?, added?, card?}], bad: [{line, text}] }
    parse(text, filename) {
      text = String(text || '').replace(/^﻿/, '');
      const t = text.trim();
      if (!t) return { kind: 'empty', rows: [], bad: [] };
      if (/^[[{]/.test(t)) {
        try { return Dict.parseJson(JSON.parse(t)); } catch (e) { return { kind: 'json', rows: [], bad: [{ line: 0, text: 'Файл схожий на JSON, але не читається: ' + e.message }] }; }
      }
      const ext = String(filename || '').toLowerCase().split('.').pop();
      const first = t.split(/\r?\n/)[0];
      if (first.includes('\t') || ext === 'tsv') return Dict.parseTable(t, '\t');
      if (ext === 'csv') return Dict.parseTable(t, (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',');
      return Dict.parseText(t);
    },
    // Приймає й словники з інших програм: поле слова — word / term / front / target чи назва мови (headers пакета)
    parseJson(data) {
      const list = Array.isArray(data) ? data : data && (Array.isArray(data.words) ? data.words : Array.isArray(data.dict) ? data.dict : null);
      if (!list) return { kind: 'json', rows: [], bad: [{ line: 0, text: 'У файлі немає списку слів (очікувалося поле words)' }] };
      const pickKey = (o, names) => { for (const n of Object.keys(o)) if (names.includes(n.toLowerCase())) return o[n]; return undefined; };
      const rows = [], bad = [], W = wordNames();
      list.forEach((item, i) => {
        let w = null;
        if (Array.isArray(item)) w = { word: item[0], uk: item[1], note: item[2], ex: item[3], ipa: item[4] };
        else if (item && typeof item === 'object') {
          w = { word: pickKey(item, W), uk: pickKey(item, UK_NAMES), note: pickKey(item, NOTE_NAMES), ex: pickKey(item, EX_NAMES), ipa: pickKey(item, IPA_NAMES), au: item.au, added: item.added };
          const card = PG.cleanCard(item.card);
          if (card) w.card = card;
        }
        const c = w && PG.cleanWord(w);
        if (c) { if (w.card) c.card = w.card; rows.push(c); } else bad.push({ line: i + 1, text: JSON.stringify(item).slice(0, 80) });
      });
      const lang = data && !Array.isArray(data) && typeof data.lang === 'string' ? data.lang : null;
      return { kind: 'json', lang, rows, bad };
    },
    // CSV за RFC 4180: лапки, подвоєні лапки й переноси рядків усередині лапок
    splitCsv(text, d) {
      const rows = [];
      let row = [], cell = '', q = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (q) {
          if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch;
        } else if (ch === '"' && cell === '') q = true;
        else if (ch === d) { row.push(cell); cell = ''; }
        else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
        else cell += ch;
      }
      if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
      return rows;
    },
    parseTable(text, d) {
      const table = Dict.splitCsv(text, d).filter((r) => r.some((c) => c.trim()));
      const W = wordNames();
      let cols = { word: 0, uk: 1, note: 2, ex: 3, ipa: 4 }, start = 0;
      const head = (table[0] || []).map((c) => c.trim().toLowerCase());
      if (head.length && (W.includes(head[0]) || head.some((h) => UK_NAMES.includes(h)))) {
        const find = (names, def) => { const i = head.findIndex((h) => names.includes(h)); return i >= 0 ? i : def; };
        cols = { word: find(W, 0), uk: find(UK_NAMES, 1), note: find(NOTE_NAMES, -1), ex: find(EX_NAMES, -1), ipa: find(IPA_NAMES, -1) };
        start = 1;
      }
      const rows = [], bad = [];
      for (let i = start; i < table.length; i++) {
        const r = table[i], get = (k) => (cols[k] >= 0 ? r[cols[k]] : '');
        const w = PG.cleanWord({ word: get('word'), uk: get('uk'), note: get('note'), ex: get('ex'), ipa: get('ipa') });
        if (w) rows.push(w); else bad.push({ line: i + 1, text: r.join(d === '\t' ? ' ⇥ ' : d).slice(0, 80) });
      }
      return { kind: d === '\t' ? 'tsv' : 'csv', rows, bad };
    },
    // Вільний текст: по слову на рядок, роздільник — перший знайдений з SEPARATORS
    parseText(text) {
      const rows = [], bad = [];
      text.split(/\r?\n/).forEach((raw, i) => {
        const line = raw.replace(/^\s*(?:\d+[.)]|[-•*–])\s+/, '').trim();
        if (!line || line.startsWith('#')) return;
        let w = null;
        for (const sep of SEPARATORS) {
          const at = line.indexOf(sep);
          if (at > 0) { w = PG.cleanWord({ word: line.slice(0, at), uk: line.slice(at + sep.length) }); break; }
        }
        if (w) rows.push(w); else bad.push({ line: i + 1, text: line.slice(0, 80) });
      });
      return { kind: 'text', rows, bad };
    },

    // План злиття: що нове, що вже є з тим самим перекладом, що з іншим, що повторюється в самому файлі
    plan(parsed) {
      const fresh = [], same = [], conflict = [], seen = new Set();
      let dup = 0;
      for (const row of parsed.rows) {
        const k = key(row.word);
        if (seen.has(k)) { dup++; continue; }
        seen.add(k);
        const cur = this.get(row.word);
        if (!cur) fresh.push(row);
        else if (PG.norm(cur.uk) === PG.norm(row.uk)) same.push({ row, cur });
        else conflict.push({ row, cur });
      }
      return { fresh, same, conflict, dup, bad: parsed.bad, kind: parsed.kind, lang: parsed.lang || null, withCards: parsed.rows.some((r) => r.card) };
    },
    // conflict: 'keep' | 'replace' | 'merge'; progress — брати прогрес повторення з файлу. Повертає підсумок і знімок для скасування
    apply(plan, opts) {
      opts = Object.assign({ conflict: 'keep', progress: true }, opts);
      const snapshot = { dict: clone(PG.S.dict), cards: {} };
      for (const k of Object.keys(PG.S.cards)) if (k.startsWith('my|')) snapshot.cards[k] = clone(PG.S.cards[k]);
      let added = 0, updated = 0, filled = 0;
      const room = Math.max(0, MAX_WORDS - PG.S.dict.length);
      const takeCard = (row, word) => {
        if (!opts.progress || !row.card) return;
        const old = PG.S.cards[cid(word)];
        if (!old || (!old.reps && row.card.reps)) PG.S.cards[cid(word)] = clone(row.card);
      };
      // Порожні поля мого слова заповнюються з файлу; заповнені — не чіпаємо
      const fill = (cur, row) => {
        let n = 0;
        for (const f of ['note', 'ex', 'ipa']) if (!cur[f] && row[f]) { cur[f] = row[f]; n++; }
        if (!cur.au && row.au) { cur.au = row.au; n++; }
        return n;
      };
      for (const row of plan.fresh.slice(0, room)) {
        const w = Object.assign({}, row);
        delete w.card;
        if (!w.added) w.added = PG.isoDay(PG.today());
        PG.S.dict.push(w);
        takeCard(row, w.word);
        added++;
      }
      for (const { row } of plan.same) {
        const cur = this.get(row.word);
        if (fill(cur, row)) filled++;
        takeCard(row, cur.word);
      }
      for (const { row } of plan.conflict) {
        const cur = this.get(row.word);
        if (opts.conflict === 'replace') { cur.uk = row.uk; updated++; } else if (opts.conflict === 'merge') {
          const parts = cur.uk.split(/\s*;\s*/);
          if (!parts.some((p) => PG.norm(p) === PG.norm(row.uk))) { cur.uk = (cur.uk + '; ' + row.uk).slice(0, 300); updated++; }
        }
        if (fill(cur, row)) filled++;
        takeCard(row, cur.word);
      }
      PG.save();
      return { added, updated, filled, skipped: plan.fresh.length - Math.min(plan.fresh.length, room), snapshot };
    },
    undo(snapshot) {
      for (const k of Object.keys(PG.S.cards)) if (k.startsWith('my|')) delete PG.S.cards[k];
      Object.assign(PG.S.cards, snapshot.cards);
      PG.S.dict = snapshot.dict;
      PG.save();
    },

    // Тренування: диктант (почути й написати), переклад українська → мова навчання, вибір перекладу
    practiceSpecs(n) {
      const all = PG.S.dict;
      if (!all.length) return [];
      const t = PG.today(), ins = PG.L.names.ins;
      // Спершу слова, які пора повторити, і нові: їх тренувати найкорисніше
      const rank = (w) => { const c = this.card(w.word); return !c ? 1 : c.due <= t ? 0 : 2; };
      const pool = PG.shuffle(all).sort((a, b) => rank(a) - rank(b)).slice(0, n || 10);
      return pool.map((w) => {
        const answers = Dict.answers(w.word);
        const types = ['i'];
        if (!/\s\/\s/.test(w.word)) types.push('l');
        const others = PG.shuffle(all.filter((x) => PG.norm(x.uk) !== PG.norm(w.uk))).map((x) => x.uk).filter((u, i, a) => a.indexOf(u) === i).slice(0, 2);
        if (others.length === 2) types.push('c');
        const type = types[Math.floor(Math.random() * types.length)];
        const note = w.note ? ' <span class="small muted">(' + PG.esc(w.note) + ')</span>' : '';
        const e = PG.sayHtml(w.word, PG.sayText(w.word)) + (w.ipa ? ' <span class="ipa">' + PG.esc(w.ipa) + '</span>' : '') + ' — ' + PG.esc(w.uk);
        // nv: слова учня показуються так, як він їх записав, без заміни правопису під варіант мови
        if (type === 'c') return { t: 'c', q: 'Що означає ' + PG.sayHtml(w.word, PG.sayText(w.word)) + '?', o: [w.uk].concat(others), e, nv: true };
        if (type === 'l') return { t: 'l', a: answers, say: PG.sayText(w.word), tr: w.uk, h: 'Прослухайте й напишіть ' + ins, nv: true };
        return { t: 'i', q: 'Як ' + ins + ': <b>' + PG.esc(w.uk) + '</b>?' + note, a: answers, e, nv: true };
      });
    },
    // Прийнятні відповіді для слова: варіанти через « / », без приміток у дужках, плюс форми від пакета («book» для «to book»)
    answers(word) {
      const out = new Set(), forms = L().answerForms;
      for (const part of String(word).split(/\s\/\s/)) {
        const p = part.trim(), plain = p.replace(/\s*\([^)]*\)/g, '').trim();
        [p, plain].forEach((x) => { if (!x) return; out.add(x); if (forms) forms(x).forEach((f) => out.add(f)); });
      }
      out.add(word);
      return Array.from(out);
    }
  };
  // Колонка зі словом мови впізнається і за спільними назвами, і за назвами мови з пакета (english, slovak, словацькою…)
  const wordNames = () => ['word', 'term', 'front', 'target', 'слово'].concat(L().headers || []);
  const UK_NAMES = ['ukrainian', 'uk', 'ua', 'translation', 'back', 'definition', 'meaning', 'переклад', 'українською', 'українська', 'укр'];
  const NOTE_NAMES = ['note', 'notes', 'comment', 'примітка', 'примітки', 'коментар'];
  const EX_NAMES = ['example', 'examples', 'sentence', 'context', 'ex', 'приклад', 'речення'];
  const IPA_NAMES = ['ipa', 'transcription', 'pronunciation', 'phonetic', 'транскрипція', 'вимова'];
  // Порядок важливий: « — » і « - » раніше за «;» і «,», бо переклад часто містить коми («квартира, житло»)
  const SEPARATORS = [' — ', ' – ', ' - ', '\t', ' ; ', ';', ' = ', '=', ' : ', ','];

  // Завантаження файлу, «Поділитися» і буфер обміну потребують браузера; у Node (validate.mjs) їх не викликають
  Dict.download = function (name, text, mime) {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  };
  Dict.canShareFiles = function () {
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['{}'], 'x.json', { type: 'application/json' })] })); } catch (e) { return false; }
  };
  Dict.share = function (name, text, mime) {
    return navigator.share({ files: [new File([text], name, { type: mime })], title: 'Polyglot — мій словник (' + PG.L.names.nom + ')' });
  };
  Dict.copy = async function (text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      ta.remove();
      return ok;
    }
  };

  PG.Dict = Dict;
})(window.PG);

</script>
<script>
/* Екрани «Мови», «Сьогодні», «Програма», «Уроки», «Урок» */
(function (PG) {
  'use strict';
  const esc = PG.esc, $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const view = () => document.getElementById('view');
  const P = () => PG.program;
  const N = () => PG.L.names;

  // [id, іконка, підпис, короткий підпис, лише на широкому екрані]. «Програма» на телефоні — посилання з «Уроків»:
  // восьма вкладка в нижній навігації не вміщується
  const NAV = [['today', '🏠', 'Сьогодні', 'Сьогодні'], ['program', '🗺️', 'Програма', 'План', true], ['lessons', '📘', 'Уроки', 'Уроки'], ['words', '🃏', 'Слова', 'Слова'],
    ['dict', '📒', 'Словник', 'Словник'], ['speak', '🎙️', 'Розмова', 'Мова'], ['ref', '📚', 'Довідник', 'Довідка'], ['settings', '⚙️', 'Налаштування', 'Опції']];

  // Той самий прапор на сторінці кілька разів (шапка, вибір мови, вибір варіанта): id у clipPath мають бути різними,
  // інакше браузер обріже копію за чужим контуром
  let flagN = 0;
  PG.flagSvg = function (code, variant) {
    const info = PG.langInfo(code);
    if (!info) return '';
    const f = info.flags, svg = (variant && f[variant]) || f[Object.keys(f)[0]];
    const n = ++flagN;
    return svg.replace(/id="([^"]+)"/g, 'id="$1-' + n + '"').replace(/url\(#([^)]+)\)/g, 'url(#$1-' + n + ')');
  };
  PG.flagHtml = (code, variant, cls) => '<span class="' + (cls || 'flag-ic') + '">' + PG.flagSvg(code, variant) + '</span>';

  function stageOf(id) { return P().stages.find((s) => s.id === id) || { level: '', title: '' }; }
  // Модуль програми може мати поле lesson: 'a2-1' — тоді він виконаний, коли пройдено урок
  const modLesson = (m) => (m.lesson && PG.lessonById(m.lesson)) || null;
  const modDone = (m) => (modLesson(m) ? PG.lessonClosed(m.lesson) : !!PG.S.modules[m.id]);
  function overall() {
    let done = 0, total = 0;
    P().stages.forEach((s) => {
      if (s.built) PG.lessons.filter((l) => l.stage === s.id).forEach((l) => { total++; if (PG.lessonClosed(l.id)) done++; });
      else (s.modules || []).forEach((m) => { total++; if (modDone(m)) done++; });
    });
    return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
  }
  // Що прогрес не зберігається чи озвучення не працює, учень має побачити на будь-якому екрані, а не лише в налаштуваннях
  function voiceBanner() {
    let h = '';
    if (PG.store.newer) h += '<div class="warn-banner">⚠️ Ваш прогрес збережено новішою версією тренажера. Оновіть сторінку з інтернетом — доти зміни не зберігаються.</div>';
    else if (PG.store.broken) h += '<div class="warn-banner">⚠️ Не вдалося прочитати збережений прогрес. Подробиці — у ⚙️ «Налаштування».</div>';
    if (PG.TTS.silent()) h += '<div class="warn-banner voice-banner">🔇 Немає інтернету, а ' + N().adjGen + ' голосу в цій системі немає, тому озвучення не працюватиме. Як додати голос, що працює без інтернету, — див. ⚙️ «Налаштування».</div>';
    return h;
  }

  // Вибір мови. Підсумки — зі збережених записів кожної мови, тож пакети інших мов тут не завантажуються
  function renderLanguages() {
    const cur = PG.code;
    const ago = (d) => { const n = PG.today() - d; return n <= 0 ? 'сьогодні' : n === 1 ? 'учора' : n + ' дн. тому'; };
    view().innerHTML = '<div class="card"><div class="row"><span class="app-logo">' + (PG.LOGO || '') + '</span><div><h1 style="margin:0">' + (cur ? '🌍 Мови' : 'Вітаємо в Polyglot! 👋') + '</h1>' +
      '<div class="muted">' + (cur ? 'Прогрес кожної мови зберігається окремо: перемикайтеся будь-коли, нічого не загубиться.' : 'Яку мову вчимо? Виберіть — змінити можна будь-коли, а прогрес кожної мови зберігається окремо.') + '</div></div></div></div>' +
      '<div class="grid g2">' + (PG.LANGS || []).map((l) => {
        const s = PG.langSummary(l.code);
        return '<div class="card lang-card' + (l.code === cur ? ' current' : '') + '"><div class="row"><span class="flag-big">' + PG.flagSvg(l.code, l.code === cur ? PG.variant() : null) + '</span>' +
          '<div><h2 style="margin:0">' + esc(l.name) + '</h2><div class="small muted">' + esc(l.native) + ' · ' + esc(l.levels) + '</div></div><span class="spacer"></span>' +
